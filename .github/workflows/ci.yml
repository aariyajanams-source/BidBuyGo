name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Commits made on Windows can drop the executable bit on the wrapper.
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # Unit and H2 integration tests (surefire), then the Postgres proof (failsafe + Testcontainers;
      # ubuntu-latest ships Docker, so it runs here instead of being skipped).
      - name: Build and verify
        run: ./mvnw -B clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
