spring:
  application:
    name: bidbuygo
  profiles:
    # Local runs and tests use the dev profile (H2 console, seed data) unless a profile is set explicitly.
    default: dev
  datasource:
    url: jdbc:h2:mem:bidbuygo;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
  jackson:
    deserialization:
      # Money is integer paise: reject 10.5 instead of silently truncating it to 10.
      accept-float-as-int: false

bidbuygo:
  jwt:
    # Base64-encoded HMAC key, at least 256 bits. Override via JWT_SECRET outside local dev.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1kZXYtb25seS1zZWNyZXQtY2hhbmdlLW1l}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  auction:
    snipe-window-seconds: 30
    extension-seconds: 30
    close-poll-ms: 5000
  scheduler:
    # Tests set this to false and close auctions by calling the settlement service directly.
    enabled: true
